apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway-oidc-lab
  labels:
    app: api-gateway-oidc-lab
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: api-gateway-oidc-lab
  template:
    metadata:
      labels:
        app: api-gateway-oidc-lab
    spec:
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      containers:
        - name: api-gateway-oidc-lab
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080

          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3

          resources:
            {{- toYaml .Values.resources | nindent 12 }}
