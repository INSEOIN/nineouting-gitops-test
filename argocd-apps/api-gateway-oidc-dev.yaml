apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nineouting-api-gateway-oidc-dev
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/INSEOIN/nineouting-gitops-test.git
    targetRevision: main
    path: charts/api-gateway-oidc-lab
    helm:
      releaseName: oidc-dev
      valueFiles:
        - values-dev.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: nineouting-oidc-dev

  syncPolicy:
    automated:
      prune: false
      selfHeal: true
